vich_uploader:
    db_driver: orm

    metadata:
        type: attribute

    mappings:
       programs_images:
           uri_prefix: /images/programs
           upload_destination: '%kernel.project_dir%/public/images/programs'
           namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
           delete_on_update: true
           delete_on_remove: true
       avatars_images:
           uri_prefix: /images/avatars
           upload_destination: '%kernel.project_dir%/public/images/avatars'
           namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
           delete_on_update: true
           delete_on_remove: true
       courses_files:
           upload_destination: '%app.course_storage_dir%/files'
           namer: App\Services\Courses\TwigFileNamer
           delete_on_update: true
           delete_on_remove: true
       audios_files:
           upload_destination: '%app.course_storage_dir%/audios'
           namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
           delete_on_update: true
           delete_on_remove: true
       courses_videos:
           upload_destination: '%app.course_storage_dir%/videos'
           namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
           delete_on_update: true
           delete_on_remove: true
