vich_uploader:
    db_driver: orm

    metadata:
        type: attribute

    mappings:
       programs_images:
           uri_prefix: /images/programs
           upload_destination: '%kernel.project_dir%/public/images/programs'
           namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
           delete_on_update: true
           delete_on_remove: true
       avatars_images:
           uri_prefix: /images/avatars
           upload_destination: '%kernel.project_dir%/public/images/avatars'
           namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
           delete_on_update: true
           delete_on_remove: true
       courses_files:
           uri_prefix: /courses/files
           upload_destination: '%kernel.project_dir%/public/courses/files'
           namer: App\Services\Courses\TwigFileNamer
           delete_on_update: true
           delete_on_remove: true
       audios_files:
           uri_prefix: /courses/audios
           upload_destination: '%kernel.project_dir%/public/courses/audios'
           namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
           delete_on_update: true
           delete_on_remove: true
       courses_videos:
           uri_prefix: /courses/videos
           upload_destination: '%kernel.project_dir%/public/courses/videos'
           namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
           delete_on_update: true
           delete_on_remove: true
