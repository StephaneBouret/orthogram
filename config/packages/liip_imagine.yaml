# Documentation on how to configure the bundle can be found at: https://symfony.com/doc/current/bundles/LiipImagineBundle/basic-usage.html
liip_imagine:
    driver: "gd"

    loaders:
        default:
            filesystem:
                data_root:
                    - '%kernel.project_dir%/public'
                    - '%kernel.project_dir%/public/images/avatars'

    webp:
        generate: true
        quality: 90

    filter_sets:
        avatar:
            quality: 90
            format: webp
            filters:
                thumbnail:
                    size: [500, 500]
                    mode: outbound
                    allow_upscale: true

        avatar_admin:
            quality: 85
            format: webp
            filters:
                thumbnail:
                    size: [80, 80]
                    mode: outbound
                    allow_upscale: true

    resolvers:
        default:
            web_path: ~

    twig:
        mode: lazy
